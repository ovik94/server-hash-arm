services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: server-hash-arm
    ports:
      - '8082:8082'
    network_mode: host
    shm_size: 2gb
    environment:
      - NODE_ENV=production
      - MONGO_LOGIN=${MONGO_LOGIN}
      - MONGO_PWD=${MONGO_PWD}
      - MONGO_HOST=127.0.0.1
      - MONGO_PORT=${MONGO_PORT}
      - MONGO_DB=${MONGO_DB}
      - IIKO_LOGIN=${IIKO_LOGIN}
      - IIKO_PASS=${IIKO_PASS}
      - IIKO_API_LOGIN=${IIKO_API_LOGIN}
      - IIKO_SERVER_LOGIN=${IIKO_SERVER_LOGIN}
      - IIKO_SERVER_PASS=${IIKO_SERVER_PASS}
      - TG_BOT_TOKEN=${TG_BOT_TOKEN}
      - GOOGLE_CLIENT_EMAIL=${GOOGLE_CLIENT_EMAIL}
      - GOOGLE_PRIVATE_KEY=${GOOGLE_PRIVATE_KEY}
      - MAX_BOT_TOKEN=${MAX_BOT_TOKEN}
      - IMAGE_RENDER_SERVICE_HOST=${IMAGE_RENDER_SERVICE_HOST}
      - IMAGE_RENDER_SERVICE_PORT=${IMAGE_RENDER_SERVICE_PORT}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: server-hash-arm-mongo
    network_mode: host
    ports:
      - '27017:27017'
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_LOGIN}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PWD}
      - MONGO_INITDB_DATABASE=${MONGO_DB}
    volumes:
      - mongo-data:/data/db
      - ./backup:/backup
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'mongosh', '--host', '127.0.0.1', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo-data:
    name: mongodb_production_data
